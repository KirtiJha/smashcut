<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Matrix Decode - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      /* ponytail: scale on wrapper (not a GSAP target), zooms content ~3× for thumbnail legibility */
      .demo-frame {
        display: grid;
        place-items: center;
        gap: 32px;
        padding: 72px 96px;
        background: #18181b;
        border-radius: 20px;
        box-shadow: 0 32px 80px rgba(0, 0, 0, 0.22);
        transform: scale(3.2);
        transform-origin: center center;
      }
      .demo-label {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #71717a;
      }
      .sc-catalog-matrix-decode {
        display: inline-flex;
        gap: 4px;
        font:
          700 52px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        color: #4ade80;
        text-shadow: 0 0 24px rgba(74, 222, 128, 0.45);
      }
      .sc-catalog-matrix-decode span {
        display: inline-block;
        min-width: 0.64em;
        opacity: var(--sc-matrix-opacity, 1);
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="matrix-decode-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="demo-label">Matrix Decode</div>
        <div
          class="sc-catalog-matrix-decode"
          data-final="SMASHCUT"
          data-composition-variables='[
    { "id": "text", "type": "string", "role": "content", "label": "Target text", "description": "Word the scramble resolves into. One scrambling cell per character, up to 32.", "default": "SMASHCUT" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour family of the cells and their glow.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "size", "type": "number", "role": "style", "label": "Size", "description": "Type size of the cells in pixels. Cell width follows it.", "default": 64, "min": 24, "max": 160, "step": 4, "unit": "px" },
    { "id": "glow", "type": "enum", "role": "style", "label": "Glow", "description": "Strength of the halo behind the cells, from none to a heavy bloom.", "default": "standard", "options": [{ "value": "none", "label": "None" }, { "value": "standard", "label": "Standard" }, { "value": "strong", "label": "Strong" }] }
  ]'
        >
          <span>0</span><span>0</span><span>0</span><span>0</span><span>0</span><span>0</span
          ><span>0</span><span>0</span><span>0</span><span>0</span>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__smashcut && window.__smashcut.getVariables
              ? window.__smashcut.getVariables()
              : {};

          // Anything missing or invalid returns to its declared default.
          var accents = {
            green: { color: "#16a34a", rgb: "22, 163, 74" },
            blue: { color: "#2563eb", rgb: "37, 99, 235" },
            violet: { color: "#7c3aed", rgb: "124, 58, 237" },
          };
          var glows = {
            none: { radius: "0px", alpha: "0" },
            standard: { radius: "18px", alpha: "0.28" },
            strong: { radius: "34px", alpha: "0.55" },
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var text = typeof vars.text === "string" ? vars.text.trim().slice(0, 32) : "";
          if (!text) {
            text = "SMASHCUT";
          }

          var size =
            typeof vars.size === "number" || typeof vars.size === "string"
              ? Number(vars.size)
              : NaN;
          size = isFinite(size) && size > 0 ? Math.min(160, Math.max(24, size)) : 64;

          var accent = accents[pick(accents, vars.accent, "green")];
          var glow = glows[pick(glows, vars.glow, "standard")];

          var roots = document.querySelectorAll(".sc-catalog-matrix-decode");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--sc-matrix-size", size + "px");
            roots[i].style.setProperty("--sc-matrix-color", accent.color);
            roots[i].style.setProperty("--sc-matrix-glow-rgb", accent.rgb);
            roots[i].style.setProperty("--sc-matrix-glow-radius", glow.radius);
            roots[i].style.setProperty("--sc-matrix-glow-alpha", glow.alpha);
            roots[i].setAttribute("data-final", text);
            while (roots[i].firstChild) {
              roots[i].removeChild(roots[i].firstChild);
            }
            for (var j = 0; j < text.length; j += 1) {
              var cell = document.createElement("span");
              cell.textContent = text.charAt(j) === " " ? "\u00a0" : "0";
              roots[i].appendChild(cell);
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".sc-catalog-matrix-decode span",
          { opacity: 0, y: 12 },
          { opacity: 1, y: 0, duration: 0.18, stagger: 0.035, ease: "power2.out" },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["matrix-decode-demo"] = tl;
      </script>
    </div>
    <style>
      .sc-catalog-matrix-decode {
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.04em;
      }
      .sc-catalog-matrix-decode {
        display: inline-flex;
        gap: 3px;
        font:
          900 64px/1 ui-monospace,
          SFMono-Regular,
          Menlo,
          monospace;
        font-size: var(--sc-matrix-size, 64px);
        color: var(--sc-matrix-color, #16a34a);
        text-shadow: 0 0 var(--sc-matrix-glow-radius, 18px)
          rgba(var(--sc-matrix-glow-rgb, 22, 163, 74), var(--sc-matrix-glow-alpha, 0.28));
      }
      .sc-catalog-matrix-decode span {
        display: inline-block;
        min-width: 0.64em;
        opacity: var(--sc-matrix-opacity, 1);
      }
    </style>
  </body>
</html>
