<style>
  .sc-catalog-confetti {
    color: var(--fg, #111827);
    font-family: var(--font-body, Inter, system-ui, sans-serif);
  }
  .sc-catalog-confetti {
    position: relative;
    width: 760px;
    height: 428px;
    overflow: hidden;
    border-radius: var(--radius, 30px);
    background: var(--bg, #080b12);
    box-shadow: 0 28px 80px color-mix(in srgb, var(--bg, #0f172a) 20%, transparent);
  }
  .sc-catalog-confetti .mesh {
    position: absolute;
    inset: -22%;
    filter: blur(44px);
    opacity: 0.88;
    background:
      radial-gradient(
        circle at var(--sc-x1, 20%) var(--sc-y1, 30%),
        var(--accent, #60a5fa) 0 18%,
        transparent 32%
      ),
      radial-gradient(
        circle at var(--sc-x2, 76%) var(--sc-y2, 52%),
        var(--accent-2, #f472b6) 0 16%,
        transparent 34%
      ),
      radial-gradient(
        circle at var(--sc-x3, 46%) var(--sc-y3, 78%),
        var(--brand, #34d399) 0 18%,
        transparent 34%
      );
  }
  .sc-catalog-confetti .card {
    position: absolute;
    inset: var(--space-3, 74px) var(--space-3, 92px);
    border: 1px solid color-mix(in srgb, var(--border, #ffffff) 16%, transparent);
    border-radius: var(--radius, 26px);
    background: color-mix(in srgb, var(--surface, #ffffff) 8%, transparent);
    color: var(--fg, #fff);
    display: grid;
    place-items: center;
    text-align: center;
    overflow: hidden;
  }
  .sc-catalog-confetti .spot {
    position: absolute;
    width: 260px;
    height: 260px;
    border-radius: 50%;
    background: radial-gradient(
      circle,
      color-mix(in srgb, var(--fg, #ffffff) 50%, transparent),
      transparent 65%
    );
    transform: translate(var(--sc-spot-x, 0px), var(--sc-spot-y, 0px));
    mix-blend-mode: screen;
  }
  .sc-catalog-confetti .particle {
    position: absolute;
    left: 50%;
    top: 54%;
    width: 12px;
    height: 20px;
    border-radius: var(--radius, 3px);
    background: var(--c);
    transform: translate(var(--sc-px, 0px), var(--sc-py, 0px)) rotate(var(--sc-pr, 0deg));
    opacity: var(--sc-po, 0);
  }
  .sc-catalog-confetti h3 {
    margin: 0;
    font-size: 44px;
    letter-spacing: -0.04em;
  }
  .sc-catalog-confetti p {
    margin: var(--space-1, 8px) 0 0;
    color: color-mix(in srgb, var(--muted, #ffffff) 70%, transparent);
  }
</style>
