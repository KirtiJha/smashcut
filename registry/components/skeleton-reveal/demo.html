<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Skeleton Reveal - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale wrapper (not a GSAP target) to fill ~60% of frame */
        transform: scale(1.51);
      }
      .sc-transition-skeleton-reveal {
        position: relative;
        width: 400px;
        height: 96px;
        font-family: Inter, system-ui, sans-serif;
      }
      .sc-transition-skeleton-reveal .skeleton,
      .sc-transition-skeleton-reveal .content {
        position: absolute;
        inset: 0;
        border: 1px solid #e4e4e7;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.08);
      }
      .sc-transition-skeleton-reveal .skeleton {
        background: linear-gradient(90deg, #f4f4f5, #e4e4e7, #f4f4f5);
        background-size: 240% 100%;
        opacity: 1;
        box-shadow: none;
      }
      .sc-transition-skeleton-reveal .content {
        display: grid;
        align-content: center;
        gap: 6px;
        padding: 20px 22px;
        opacity: 0;
        color: #18181b;
      }
      .sc-transition-skeleton-reveal strong {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .sc-transition-skeleton-reveal span {
        color: #71717a;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="skeleton-reveal-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="sc-transition-skeleton-reveal"
          data-composition-variables='[
    { "id": "name", "type": "string", "role": "content", "label": "Name", "description": "Primary line revealed once the skeleton fades out.", "default": "Jane Cooper" },
    { "id": "detail", "type": "string", "role": "content", "label": "Detail", "description": "Secondary line under the name, such as an email or a role.", "default": "jane@example.com" },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Card palette. Light is the paper card, dark is a near-black card with the matching skeleton bars and text.", "default": "light", "options": [{ "value": "light", "label": "Light" }, { "value": "dark", "label": "Dark" }] }
  ]'
        >
          <div class="skeleton"></div>
          <div class="content"><strong>Jane Cooper</strong><span>jane@example.com</span></div>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__smashcut && window.__smashcut.getVariables
              ? window.__smashcut.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var tones = {
            light: null,
            dark: {
              "--sc-sr-surface": "#18181b",
              "--sc-sr-border": "#27272a",
              "--sc-sr-bar": "#27272a",
              "--sc-sr-bar-strong": "#3f3f46",
              "--sc-sr-ink": "#fafafa",
              "--sc-sr-muted": "#a1a1aa",
            },
          };
          var defaultName = "Jane Cooper";
          var defaultDetail = "jane@example.com";

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          function text(value, fallback) {
            return typeof value === "string" && value.trim() ? value.trim() : fallback;
          }

          var tone = tones[pick(tones, vars.tone, "light")];
          var name = text(vars.name, defaultName);
          var detail = text(vars.detail, defaultDetail);

          var roots = document.querySelectorAll(".sc-transition-skeleton-reveal");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            if (tone) {
              for (var key in tone) root.style.setProperty(key, tone[key]);
            }
            var strong = root.querySelector(".content strong");
            var span = root.querySelector(".content span");
            if (strong) strong.textContent = name;
            if (span) span.textContent = detail;
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.to(
          ".sc-transition-skeleton-reveal .skeleton",
          { backgroundPosition: "100% 0", duration: 0.7, ease: "none" },
          startTime,
        );
        tl.to(
          ".sc-transition-skeleton-reveal .skeleton",
          { opacity: 0, duration: 0.22 },
          startTime + 0.72,
        );
        tl.to(
          ".sc-transition-skeleton-reveal .content",
          { opacity: 1, duration: 0.24 },
          startTime + 0.78,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["skeleton-reveal-demo"] = tl;
      </script>
    </div>
    <style>
      .sc-transition-skeleton-reveal {
        position: relative;
        width: 340px;
        height: 76px;
        font-family: Inter, system-ui, sans-serif;
      }
      .sc-transition-skeleton-reveal .skeleton,
      .sc-transition-skeleton-reveal .content {
        position: absolute;
        inset: 0;
        border: 1px solid var(--sc-sr-border, #e4e4e7);
        border-radius: 14px;
        background: var(--sc-sr-surface, #fff);
      }
      .sc-transition-skeleton-reveal .skeleton {
        background: linear-gradient(
          90deg,
          var(--sc-sr-bar, #f4f4f5),
          var(--sc-sr-bar-strong, #e4e4e7),
          var(--sc-sr-bar, #f4f4f5)
        );
        background-size: 240% 100%;
        opacity: 1;
      }
      .sc-transition-skeleton-reveal .content {
        display: grid;
        align-content: center;
        gap: 5px;
        padding: 15px;
        opacity: 0;
        color: var(--sc-sr-ink, #18181b);
      }
      .sc-transition-skeleton-reveal span {
        color: var(--sc-sr-muted, #71717a);
        font-size: 14px;
      }
    </style>
  </body>
</html>
