<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Panel Reveal - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale wrapper — GSAP targets .sc-transition-panel-reveal, not this element */
        transform: scale(2.6);
        transform-origin: center center;
      }
      .sc-transition-panel-reveal {
        --sc-panel-open: 1;
        width: 380px;
        overflow: hidden;
        border: 1px solid #e4e4e7;
        border-radius: 14px;
        background: #fff;
        color: #18181b;
        font-family: Inter, system-ui, sans-serif;
        box-shadow: 0 24px 70px rgba(24, 24, 27, 0.1);
      }
      .sc-transition-panel-reveal header {
        padding: 18px 20px 14px;
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }
      .sc-transition-panel-reveal div {
        max-height: calc(var(--sc-panel-open) * 120px);
        opacity: var(--sc-panel-open);
        padding: 0 20px calc(var(--sc-panel-open) * 20px);
        overflow: hidden;
      }
      .sc-transition-panel-reveal p {
        margin: 0 0 8px;
        color: #71717a;
        font-size: 15px;
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="panel-reveal-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <section
          class="sc-transition-panel-reveal"
          data-composition-variables='[
    { "id": "title", "type": "string", "role": "content", "label": "Title", "description": "The header line that sits above the folded body.", "default": "Motion tokens" },
    { "id": "width", "type": "enum", "role": "layout", "label": "Width", "description": "How wide the panel sits, 280, 360 or 480 px.", "default": "standard", "options": [{ "value": "narrow", "label": "Narrow" }, { "value": "standard", "label": "Standard" }, { "value": "wide", "label": "Wide" }] },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Surface family: paper is the white card for light frames, ink inverts it for dark frames.", "default": "paper", "options": [{ "value": "paper", "label": "Paper" }, { "value": "ink", "label": "Ink" }] },
    { "id": "reveal", "type": "enum", "role": "motion", "label": "Reveal", "description": "Whether the body fades in with the height. fade is the shipped motion, solid opens the height only.", "default": "fade", "options": [{ "value": "fade", "label": "Fade" }, { "value": "solid", "label": "Solid" }] }
  ]'
        >
          <header>Motion tokens</header>
          <div>
            <p>Duration 420ms</p>
            <p>Easing power3.out</p>
          </div>
        </section>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__smashcut && window.__smashcut.getVariables
              ? window.__smashcut.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var widths = { narrow: "280px", standard: "360px", wide: "480px" };
          var tones = {
            paper: {
              surface: "#fff",
              border: "#e4e4e7",
              text: "#18181b",
              muted: "#71717a",
            },
            ink: {
              surface: "#18181b",
              border: "#3f3f46",
              text: "#fafafa",
              muted: "#a1a1aa",
            },
          };
          var reveals = { fade: 1, solid: 0 };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var width = widths[pick(widths, vars.width, "standard")];
          var tone = tones[pick(tones, vars.tone, "paper")];
          var fade = reveals[pick(reveals, vars.reveal, "fade")];

          var title = typeof vars.title === "string" ? vars.title.trim() : "";
          if (!title) {
            title = "Motion tokens";
          }

          var roots = document.querySelectorAll(".sc-transition-panel-reveal");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--sc-panel-width", width);
            root.style.setProperty("--sc-panel-surface", tone.surface);
            root.style.setProperty("--sc-panel-border", tone.border);
            root.style.setProperty("--sc-panel-text", tone.text);
            root.style.setProperty("--sc-panel-muted", tone.muted);
            root.style.setProperty("--sc-panel-fade", String(fade));

            var header = root.querySelector("header");
            if (header) {
              header.textContent = title;
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".sc-transition-panel-reveal",
          { "--sc-panel-open": 0 },
          { "--sc-panel-open": 1, duration: 0.44, ease: "power3.inOut" },
          startTime,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["panel-reveal-demo"] = tl;
      </script>
    </div>
    <style>
      .sc-transition-panel-reveal {
        --sc-panel-open: 1;
        width: var(--sc-panel-width, 360px);
        overflow: hidden;
        border: 1px solid var(--sc-panel-border, #e4e4e7);
        border-radius: 14px;
        background: var(--sc-panel-surface, #fff);
        color: var(--sc-panel-text, #18181b);
        font-family: Inter, system-ui, sans-serif;
        box-shadow: 0 20px 56px rgba(24, 24, 27, 0.1);
      }
      .sc-transition-panel-reveal header {
        padding: 15px 17px;
        font-weight: 900;
      }
      .sc-transition-panel-reveal div {
        max-height: calc(var(--sc-panel-open) * 120px);
        opacity: calc(1 - var(--sc-panel-fade, 1) * (1 - var(--sc-panel-open)));
        padding: 0 17px calc(var(--sc-panel-open) * 17px);
        overflow: hidden;
      }
      .sc-transition-panel-reveal p {
        margin: 0 0 8px;
        color: var(--sc-panel-muted, #71717a);
        font-size: 14px;
      }
    </style>
  </body>
</html>
