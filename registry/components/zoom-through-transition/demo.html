<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Zoom Through Transition - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        padding: 52px;
        /* ponytail: scale non-animated wrapper to fill ~65% of 1920×1080 */
        transform: scale(1.7);
      }
      .sc-catalog-zoom-through-transition {
        --sc-accent: var(--accent, rgba(255, 255, 255, 0.28));
        --sc-l1: rgba(255, 255, 255, 0.72);
        --sc-l3: rgba(255, 255, 255, 0.18);
        --sc-l4: rgba(255, 255, 255, 0.08);
        --sc-hair: rgba(255, 255, 255, 0.14);
        --sc-ink: #111827;
        --sc-muted: #6b7280;
        --sc-surface: #ffffff;
        color: var(--sc-ink);
        font-family: Inter, system-ui, sans-serif;
      }
      .sc-catalog-zoom-through-transition {
        position: relative;
        width: 760px;
        height: 428px;
        overflow: hidden;
        border-radius: 30px;
        background: #111827;
        box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
      }
      .sc-catalog-zoom-through-transition .scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 58px;
        letter-spacing: -0.05em;
        color: #fff;
      }
      .sc-catalog-zoom-through-transition .from {
        background:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 4px),
          var(--sc-l4);
        transform: translate(var(--sc-from-x, 0px), var(--sc-from-y, 0px))
          scale(var(--sc-from-scale, 1));
        filter: blur(var(--sc-from-blur, 0px));
      }
      .sc-catalog-zoom-through-transition .to {
        background:
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 4px),
          var(--sc-l3);
        box-shadow: inset 0 0 0 2px var(--sc-accent);
        transform: translate(var(--sc-to-x, 0px), var(--sc-to-y, 0px)) scale(var(--sc-to-scale, 1));
        clip-path: inset(
          var(--sc-clip-top, 0%) var(--sc-clip-right, 100%) var(--sc-clip-bottom, 0%)
            var(--sc-clip-left, 0%)
        );
      }
      .sc-catalog-zoom-through-transition .fx {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        mix-blend-mode: screen;
        transform: translateX(var(--sc-fx-x, -110%));
      }
      .sc-catalog-zoom-through-transition .rgb {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: var(--sc-rgb-opacity, 0);
        background: linear-gradient(
          90deg,
          rgba(239, 68, 68, 0.35),
          transparent,
          rgba(34, 211, 238, 0.35)
        );
        transform: translateX(var(--sc-rgb-x, 0px));
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="zoom-through-transition-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div class="sc-catalog-zoom-through-transition">
          <div class="scene from">Before</div>
          <div class="scene to">Zoom Through Transition</div>
          <div class="fx"></div>
          <div class="rgb"></div>
        </div>
      </div>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".sc-catalog-zoom-through-transition .to",
          { "--sc-clip-right": "100%", "--sc-to-x": "60px", "--sc-to-scale": 1.04 },
          {
            "--sc-clip-right": "0%",
            "--sc-to-x": "0px",
            "--sc-to-scale": 1,
            duration: 0.9,
            ease: "power3.inOut",
          },
          startTime,
        );
        tl.to(
          ".sc-catalog-zoom-through-transition .from",
          {
            "--sc-from-x": "-70px",
            "--sc-from-scale": 0.96,
            "--sc-from-blur": "5px",
            duration: 0.9,
            ease: "power3.inOut",
          },
          startTime,
        );
        tl.fromTo(
          ".sc-catalog-zoom-through-transition .fx",
          { "--sc-fx-x": "-110%" },
          { "--sc-fx-x": "110%", duration: 0.58, ease: "power2.inOut" },
          startTime + 0.18,
        );
        tl.fromTo(
          ".sc-catalog-zoom-through-transition .rgb",
          { "--sc-rgb-opacity": 0, "--sc-rgb-x": "-16px" },
          {
            "--sc-rgb-opacity": 1,
            "--sc-rgb-x": "16px",
            repeat: 3,
            yoyo: true,
            duration: 0.07,
            ease: "steps(1)",
          },
          startTime + 0.32,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["zoom-through-transition-demo"] = tl;
      </script>
    </div>
  </body>
</html>
