<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Badge Pop - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f4f4f5;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        padding: 56px;
        transform: scale(
          3
        ); /* ponytail: scale wrapper (hugs content — no min-width inflation), not GSAP targets */
        transform-origin: center;
      }
      .sc-transition-badge-pop {
        position: relative;
        display: inline-grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
      }
      .sc-transition-badge-button {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border: 1px solid #e4e4e7;
        border-radius: 22px;
        background: #ffffff;
        color: #18181b;
        box-shadow: 0 20px 58px rgba(0, 0, 0, 0.12);
      }
      .sc-transition-badge-button svg {
        width: 30px;
        height: 30px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sc-transition-badge-count {
        position: absolute;
        right: -8px;
        top: -8px;
        display: grid;
        place-items: center;
        min-width: 30px;
        height: 30px;
        padding: 0 8px;
        border: 3px solid #ffffff;
        border-radius: 999px;
        background: #ef4444;
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
        transform-origin: center;
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="badge-pop-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="sc-transition-badge-pop"
          data-composition-variables='[
    { "id": "count", "type": "string", "role": "style", "label": "Count", "description": "Text shown inside the notification badge, up to four characters.", "default": "3", "maxLength": 4 },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour family of the badge.", "default": "red", "options": [{ "value": "red", "label": "Red" }, { "value": "blue", "label": "Blue" }, { "value": "green", "label": "Green" }, { "value": "violet", "label": "Violet" }] },
    { "id": "surface", "type": "enum", "role": "style", "label": "Surface", "description": "Chrome of the button and the badge ring: light for bright frames, dark for dark ones.", "default": "light", "options": [{ "value": "light", "label": "Light" }, { "value": "dark", "label": "Dark" }] }
  ]'
        >
          <button class="sc-transition-badge-button" type="button" aria-label="Notifications">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M18 8a6 6 0 10-12 0c0 7-3 7-3 7h18s-3 0-3-7" />
              <path d="M10 20a2 2 0 004 0" />
            </svg>
          </button>
          <span class="sc-transition-badge-count">3</span>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__smashcut && window.__smashcut.getVariables
              ? window.__smashcut.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          // The badge is the one accent-carrying element here. red is the literal
          // notification convention and stays; the decorative options ride the
          // composition's own tokens and fall back to ink.
          var accents = {
            red: "#ef4444",
            blue: "var(--accent, #18181b)",
            green: "var(--brand, #18181b)",
            violet: "var(--accent-2, #18181b)",
          };
          var surfaces = {
            light: { surface: "#ffffff", border: "#e4e4e7", ink: "#18181b" },
            dark: { surface: "#101014", border: "#2a2a32", ink: "#fafafa" },
          };

          var accent = accents[pick(accents, vars.accent, "red")];
          var surface = surfaces[pick(surfaces, vars.surface, "light")];
          var count =
            typeof vars.count === "string" && vars.count.trim()
              ? vars.count.trim().slice(0, 4)
              : "3";

          var roots = document.querySelectorAll(".sc-transition-badge-pop");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--sc-badge-pop-accent", accent);
            root.style.setProperty("--sc-badge-pop-surface", surface.surface);
            root.style.setProperty("--sc-badge-pop-border", surface.border);
            root.style.setProperty("--sc-badge-pop-ink", surface.ink);
            var label = root.querySelector(".sc-transition-badge-count");
            if (label) {
              label.textContent = count;
            }
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".sc-transition-badge-button",
          { y: 18, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.34, ease: "power2.out" },
          0.35,
        );
        tl.fromTo(
          ".sc-transition-badge-count",
          { scale: 0, opacity: 0 },
          { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2.4)" },
          0.7,
        );
        tl.to(
          ".sc-transition-badge-count",
          { scale: 1.18, duration: 0.12, yoyo: true, repeat: 1, ease: "power1.inOut" },
          1.15,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["badge-pop-demo"] = tl;
      </script>
    </div>
    <style>
      .sc-transition-badge-pop {
        --sc-badge-pop-accent: #ef4444;
        --sc-badge-pop-surface: #ffffff;
        --sc-badge-pop-border: #e4e4e7;
        --sc-badge-pop-ink: #18181b;
        position: relative;
        display: inline-grid;
        place-items: center;
        font-family: Inter, system-ui, sans-serif;
      }
      .sc-transition-badge-button {
        display: grid;
        place-items: center;
        width: 76px;
        height: 76px;
        border: 1px solid var(--sc-badge-pop-border);
        border-radius: 22px;
        background: var(--sc-badge-pop-surface);
        color: var(--sc-badge-pop-ink);
        box-shadow: 0 20px 58px rgba(0, 0, 0, 0.12);
      }
      .sc-transition-badge-button svg {
        width: 30px;
        height: 30px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .sc-transition-badge-count {
        position: absolute;
        right: -8px;
        top: -8px;
        display: grid;
        place-items: center;
        min-width: 30px;
        height: 30px;
        padding: 0 8px;
        border: 3px solid var(--sc-badge-pop-surface);
        border-radius: 999px;
        background: var(--sc-badge-pop-accent);
        color: #ffffff;
        font-size: 13px;
        font-weight: 900;
        transform-origin: center;
      }
    </style>
  </body>
</html>
