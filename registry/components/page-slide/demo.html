<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Page Slide - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f5f5f4;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        min-width: 760px;
        min-height: 480px;
        padding: 56px;
        /* ponytail: scale wrapper (not the GSAP target) to fill ~63% of frame */
        transform: scale(2.2);
        transform-origin: center center;
      }
      .sc-transition-page-slide {
        position: relative;
        width: 560px;
        height: 320px;
        overflow: hidden;
        border-radius: 30px;
        background: #111827;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.22);
        font-family: Inter, system-ui, sans-serif;
      }
      .sc-transition-page {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .sc-transition-page span {
        padding: 14px 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-size: 28px;
        font-weight: 900;
      }
      .sc-transition-page.old {
        background: linear-gradient(135deg, #0f172a, #334155);
      }
      .sc-transition-page.new {
        background: linear-gradient(135deg, #155e75, #10b981);
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="page-slide-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="sc-transition-page-slide"
          data-composition-variables='[
    { "id": "label_a", "type": "string", "role": "content", "label": "Outgoing label", "description": "Label printed on the page that slides out.", "default": "Dashboard" },
    { "id": "label_b", "type": "string", "role": "content", "label": "Incoming label", "description": "Label printed on the page that slides in.", "default": "Analytics" },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Gradient family painted on the incoming page. The outgoing page stays slate.", "default": "green", "options": [{ "value": "green", "label": "Green" }, { "value": "blue", "label": "Blue" }, { "value": "violet", "label": "Violet" }] },
    { "id": "corner", "type": "enum", "role": "style", "label": "Corner", "description": "Corner radius of the frame the pages slide inside.", "default": "round", "options": [{ "value": "square", "label": "Square" }, { "value": "soft", "label": "Soft" }, { "value": "round", "label": "Round" }] }
  ]'
        >
          <section class="sc-transition-page old"><span>Dashboard</span></section>
          <section class="sc-transition-page new"><span>Analytics</span></section>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__smashcut && window.__smashcut.getVariables
              ? window.__smashcut.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var accents = {
            green: { from: "#155e75", to: "#10b981" },
            blue: { from: "#1e3a8a", to: "#38bdf8" },
            violet: { from: "#4c1d95", to: "#a78bfa" },
          };
          var corners = { square: "0px", soft: "14px", round: "30px" };

          function text(value, fallback) {
            return typeof value === "string" && value !== "" ? value : fallback;
          }
          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var labelA = text(vars.label_a, "Dashboard");
          var labelB = text(vars.label_b, "Analytics");
          var accent = accents[pick(accents, vars.accent, "green")];
          var corner = corners[pick(corners, vars.corner, "round")];

          var roots = document.querySelectorAll(".sc-transition-page-slide");
          for (var i = 0; i < roots.length; i += 1) {
            var root = roots[i];
            root.style.setProperty("--sc-page-radius", corner);
            root.style.setProperty("--sc-page-from", accent.from);
            root.style.setProperty("--sc-page-to", accent.to);
            var oldLabel = root.querySelector(".sc-transition-page.old span");
            var newLabel = root.querySelector(".sc-transition-page.new span");
            if (oldLabel) oldLabel.textContent = labelA;
            if (newLabel) newLabel.textContent = labelB;
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        tl.fromTo(
          ".sc-transition-page-slide",
          { opacity: 0, y: 24 },
          { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" },
          0.25,
        );
        tl.fromTo(
          ".sc-transition-page.new",
          { xPercent: 100 },
          { xPercent: 0, duration: 0.74, ease: "power3.inOut" },
          0.78,
        );
        tl.to(
          ".sc-transition-page.old",
          { xPercent: -28, scale: 0.94, duration: 0.74, ease: "power3.inOut" },
          0.78,
        );
        tl.fromTo(
          ".sc-transition-page.new span",
          { y: 24, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.28, ease: "power2.out" },
          1.24,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["page-slide-demo"] = tl;
      </script>
    </div>
    <style>
      .sc-transition-page-slide {
        position: relative;
        width: 560px;
        height: 320px;
        overflow: hidden;
        border-radius: var(--sc-page-radius, 30px);
        background: #111827;
        box-shadow: 0 28px 90px rgba(0, 0, 0, 0.22);
        font-family: Inter, system-ui, sans-serif;
      }
      .sc-transition-page {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
      }
      .sc-transition-page span {
        padding: 14px 20px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        color: #ffffff;
        font-size: 28px;
        font-weight: 900;
      }
      .sc-transition-page.old {
        background: linear-gradient(135deg, #0f172a, #334155);
      }
      .sc-transition-page.new {
        background: linear-gradient(
          135deg,
          var(--sc-page-from, #155e75),
          var(--sc-page-to, #10b981)
        );
      }
    </style>
  </body>
</html>
