<!--
  Keyframe Scrub Stack - advanced SmashCut primitive.

  This is intentionally seekable: drive it from a paused GSAP timeline.
  MotionPath examples require GSAP MotionPathPlugin. Three.js examples expose
  a render(progress) adapter instead of a free-running requestAnimationFrame loop.
-->

<div class="sc-advanced-keyframe-scrub-stack">
  <div class="stack">
    <div class="card" style="--i: 0"></div>
    <div class="card" style="--i: 1"></div>
    <div class="card" style="--i: 2"></div>
  </div>
</div>

<style>
  .sc-advanced-keyframe-scrub-stack {
    --sc-accent: var(--accent, rgba(17, 24, 39, 0.72));
    --sc-l1: rgba(17, 24, 39, 0.72);
    --sc-l3: rgba(17, 24, 39, 0.18);
    --sc-l4: rgba(17, 24, 39, 0.08);
    --sc-hair: rgba(17, 24, 39, 0.14);
    color: var(--sc-l1);
    font-family: Inter, system-ui, sans-serif;
  }
  .sc-advanced-keyframe-scrub-stack {
    width: 720px;
    min-height: 420px;
    border-radius: 30px;
    padding: 36px;
    background: #fff;
    box-shadow: 0 28px 80px rgba(15, 23, 42, 0.16);
    display: grid;
    place-items: center;
  }
  .sc-advanced-keyframe-scrub-stack .grid {
    display: grid;
    grid-template-columns: repeat(8, 46px);
    gap: 10px;
  }
  .sc-advanced-keyframe-scrub-stack .cell {
    width: 46px;
    height: 46px;
    border-radius: 14px;
    background: var(--sc-l1);
    transform: translateY(var(--sc-cell-y, 0px)) scale(var(--sc-cell-scale, 1));
    opacity: var(--sc-cell-opacity, 1);
  }
  .sc-advanced-keyframe-scrub-stack svg {
    width: 520px;
    height: 220px;
    overflow: visible;
  }
  .sc-advanced-keyframe-scrub-stack path {
    fill: none;
    stroke: var(--sc-accent);
    stroke-width: 14;
    stroke-linecap: round;
    stroke-dasharray: 900;
    stroke-dashoffset: var(--sc-dash, 0);
  }
  .sc-advanced-keyframe-scrub-stack .stack {
    position: relative;
    width: 520px;
    height: 260px;
  }
  .sc-advanced-keyframe-scrub-stack .card {
    position: absolute;
    inset: 0;
    border-radius: 26px;
    background: linear-gradient(var(--sc-l4), var(--sc-l4)), #ffffff;
    border: 1px solid var(--sc-hair);
    box-shadow: 0 20px 54px rgba(15, 23, 42, 0.14);
    transform: translateY(var(--sc-card-y, 0px)) scale(var(--sc-card-scale, 1));
    opacity: var(--sc-card-opacity, 1);
  }
</style>

<!--
  Timeline integration:
  const startTime = 0;
  tl.fromTo('.sc-advanced-keyframe-scrub-stack .card', { '--sc-card-y': '42px', '--sc-card-scale': 0.88, '--sc-card-opacity': 0 }, { '--sc-card-y': (i) => (i * 26) + 'px', '--sc-card-scale': (i) => 1 - i * 0.04, '--sc-card-opacity': 1, duration: 0.48, stagger: 0.12, ease: 'back.out(1.6)' }, startTime);
-->
