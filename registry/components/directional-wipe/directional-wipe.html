<!--
  Directional Wipe - catalog component for SmashCut.

  Paste the markup and CSS into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.

  Variables. The script below reads each one, falls back to the declared
  default on anything missing or unrecognised, and writes the result as a
  custom property the CSS consumes. The timeline recipe at the bottom is
  untouched by them.

    - palette (slate | teal | ember, default slate): ink of the ring that marks
      the incoming panel. Both panels are monochrome placeholder material; the
      ring is the one accent-coloured element. slate rides --accent, teal rides
      --brand, ember rides --accent-2, and each falls back to a neutral hairline
      so an unthemed composition renders in black and white.
    - corner (square | rounded | soft, default rounded): corner radius of the
      card. square is 0, rounded the original 30px, soft 56px.

  On every default the motion is unchanged.
-->

<div
  class="sc-catalog-directional-wipe"
  data-composition-variables='[
    { "id": "palette", "type": "enum", "role": "style", "label": "Palette", "description": "Theme token for the ring marking the incoming panel. Slate rides --accent, teal --brand, ember --accent-2; each falls back to a neutral hairline.", "default": "slate", "options": [{ "value": "slate", "label": "Slate" }, { "value": "teal", "label": "Teal" }, { "value": "ember", "label": "Ember" }] },
    { "id": "corner", "type": "enum", "role": "style", "label": "Corner", "description": "Corner radius of the transition card.", "default": "rounded", "options": [{ "value": "square", "label": "Square" }, { "value": "rounded", "label": "Rounded" }, { "value": "soft", "label": "Soft" }] }
  ]'
>
  <div class="scene from">Before</div>
  <div class="scene to">Directional Wipe</div>
  <div class="fx"></div>
  <div class="rgb"></div>
</div>

<style>
  .sc-catalog-directional-wipe {
    --sc-accent: var(--accent, rgba(255, 255, 255, 0.28));
    --sc-l1: rgba(255, 255, 255, 0.72);
    --sc-l3: rgba(255, 255, 255, 0.18);
    --sc-l4: rgba(255, 255, 255, 0.08);
    --sc-hair: rgba(255, 255, 255, 0.14);
    --sc-ink: #111827;
    --sc-muted: #6b7280;
    --sc-surface: #ffffff;
    color: var(--sc-ink);
    font-family: Inter, system-ui, sans-serif;
  }
  .sc-catalog-directional-wipe {
    position: relative;
    width: 760px;
    height: 428px;
    overflow: hidden;
    border-radius: var(--sc-corner, 30px);
    background: #111827;
    box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
  }
  .sc-catalog-directional-wipe .scene {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-weight: 900;
    font-size: 58px;
    letter-spacing: -0.05em;
    color: #fff;
  }
  .sc-catalog-directional-wipe .from {
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.04) 0 1px, transparent 1px 4px),
      var(--sc-l4);
    transform: translate(var(--sc-from-x, 0px), var(--sc-from-y, 0px))
      scale(var(--sc-from-scale, 1));
    filter: blur(var(--sc-from-blur, 0px));
  }
  .sc-catalog-directional-wipe .to {
    background:
      repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.05) 0 1px, transparent 1px 4px),
      var(--sc-l3);
    box-shadow: inset 0 0 0 2px var(--sc-accent);
    transform: translate(var(--sc-to-x, 0px), var(--sc-to-y, 0px)) scale(var(--sc-to-scale, 1));
    clip-path: inset(
      var(--sc-clip-top, 0%) var(--sc-clip-right, 100%) var(--sc-clip-bottom, 0%)
        var(--sc-clip-left, 0%)
    );
  }
  .sc-catalog-directional-wipe .fx {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
    mix-blend-mode: screen;
    transform: translateX(var(--sc-fx-x, -110%));
  }
  .sc-catalog-directional-wipe .rgb {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: var(--sc-rgb-opacity, 0);
    background: linear-gradient(
      90deg,
      rgba(239, 68, 68, 0.35),
      transparent,
      rgba(34, 211, 238, 0.35)
    );
    transform: translateX(var(--sc-rgb-x, 0px));
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__smashcut && window.__smashcut.getVariables
        ? window.__smashcut.getVariables()
        : {};

    // Unrecognised overrides fall back to their declared defaults.
    // Theme tokens only. The neutral fallback keeps an unthemed mount monochrome.
    var HAIRLINE = "rgba(255, 255, 255, 0.28)";
    var palettes = {
      slate: "var(--accent, " + HAIRLINE + ")",
      teal: "var(--brand, " + HAIRLINE + ")",
      ember: "var(--accent-2, " + HAIRLINE + ")",
    };
    var corners = { square: "0px", rounded: "30px", soft: "56px" };

    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var palette = palettes[pick(palettes, vars.palette, "slate")];
    var corner = corners[pick(corners, vars.corner, "rounded")];

    var roots = document.querySelectorAll(".sc-catalog-directional-wipe");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--sc-accent", palette);
      roots[i].style.setProperty("--sc-corner", corner);
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.sc-catalog-directional-wipe .to', { '--sc-clip-right': '100%', '--sc-to-x': '60px', '--sc-to-scale': 1.04 }, { '--sc-clip-right': '0%', '--sc-to-x': '0px', '--sc-to-scale': 1, duration: 0.9, ease: 'power3.inOut' }, startTime); tl.to('.sc-catalog-directional-wipe .from', { '--sc-from-x': '-70px', '--sc-from-scale': 0.96, '--sc-from-blur': '5px', duration: 0.9, ease: 'power3.inOut' }, startTime); tl.fromTo('.sc-catalog-directional-wipe .fx', { '--sc-fx-x': '-110%' }, { '--sc-fx-x': '110%', duration: 0.58, ease: 'power2.inOut' }, startTime + 0.18); tl.fromTo('.sc-catalog-directional-wipe .rgb', { '--sc-rgb-opacity': 0, '--sc-rgb-x': '-16px' }, { '--sc-rgb-opacity': 1, '--sc-rgb-x': '16px', repeat: 3, yoyo: true, duration: 0.07, ease: 'steps(1)' }, startTime + 0.32);
-->
