<!--
  Focus Blur Resolve - typography primitive for SmashCut.

  Paste the markup and CSS into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS consumes. The timeline recipe below is untouched by them: it keeps
  driving one scale and one blur, and these decide how big the words are, what
  colour they resolve to, and how deep the blur they resolve from goes.

    - tone (ink | paper | accent, default ink): word colour. ink is near-black
      for light frames, paper near-white for dark ones, accent rides --brand.
    - size (compact | standard | display, default standard): type size, 40px,
      56px or 84px.
    - blur (soft | standard | heavy, default standard): scales the blur radius,
      so the pull starts as a light haze or a full smear over the same run.

  On every default the result is identical to the original: near-black 56px
  words resolving out of a 16px blur.
-->

<div
  class="sc-catalog-focus-blur-resolve"
  data-composition-variables='[
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Word colour: ink for light frames, paper for dark ones, accent rides --brand.", "default": "ink", "options": [{ "value": "ink", "label": "Ink" }, { "value": "paper", "label": "Paper" }, { "value": "accent", "label": "Accent" }] },
    { "id": "size", "type": "enum", "role": "style", "label": "Size", "description": "Type size of the words, from a caption-scale line to a full display card.", "default": "standard", "options": [{ "value": "compact", "label": "Compact" }, { "value": "standard", "label": "Standard" }, { "value": "display", "label": "Display" }] },
    { "id": "blur", "type": "enum", "role": "style", "label": "Blur", "description": "Scales the blur radius the timeline drives, so the focus pull starts as a light haze or a full smear.", "default": "standard", "options": [{ "value": "soft", "label": "Soft" }, { "value": "standard", "label": "Standard" }, { "value": "heavy", "label": "Heavy" }] }
  ]'
>
  <span>Crystal</span><span>clear</span>
</div>

<style>
  .sc-catalog-focus-blur-resolve {
    color: var(--sc-word-color, #18181b);
    font-family: Inter, system-ui, sans-serif;
    font-weight: 900;
    letter-spacing: -0.04em;
  }
  .sc-catalog-focus-blur-resolve {
    display: inline-flex;
    gap: 12px;
    font-size: var(--sc-word-size, 56px);
    line-height: 1;
  }
  .sc-catalog-focus-blur-resolve span {
    display: inline-block;
    transform: translate(var(--sc-word-x, 0px), var(--sc-word-y, 0px))
      scale(var(--sc-word-scale, 1));
    filter: blur(calc(var(--sc-word-blur, 0px) * var(--sc-word-blur-scale, 1)));
    will-change: transform, filter, opacity;
  }
</style>

<script>
  (function () {
    "use strict";

    var vars =
      window.__smashcut && window.__smashcut.getVariables
        ? window.__smashcut.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    var tones = { ink: "#18181b", paper: "#fafafa", accent: "var(--brand, #34d399)" };
    var sizes = { compact: "40px", standard: "56px", display: "84px" };
    var blurScales = { soft: 0.45, standard: 1, heavy: 2.2 };

    var tone = tones[pick(tones, vars.tone, "ink")];
    var size = sizes[pick(sizes, vars.size, "standard")];
    var blurScale = blurScales[pick(blurScales, vars.blur, "standard")];

    var roots = document.querySelectorAll(".sc-catalog-focus-blur-resolve");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--sc-word-color", tone);
      roots[i].style.setProperty("--sc-word-size", size);
      roots[i].style.setProperty("--sc-word-blur-scale", String(blurScale));
    }
  })();
</script>

<!--
  Timeline integration:
  tl.fromTo('.sc-catalog-focus-blur-resolve span', { opacity: 0, '--sc-word-scale': 1.08, '--sc-word-blur': '16px' }, { opacity: 1, '--sc-word-scale': 1, '--sc-word-blur': '0px', duration: 0.52, stagger: 0.05, ease: 'power3.out' }, startTime);
-->
