<!--
  Streaming Text - AI-answer token-flow primitive.

  Paste the markup, CSS and script into a composition. Use the timeline
  integration note at the bottom as the starting point for deterministic GSAP
  animation.

  This is not a typewriter. A typewriter is even; an AI answer arrives in
  bursts - two words together, a pause, three more. The GAPS table in the
  integration note is that rhythm, measured word-by-word from reference
  footage of a real streamed answer, and each word lands grey and inks to
  full colour over 0.27s, the way fresh tokens read before the eye settles.

  Wrap each word in a span with class "w". The script only styles; the
  timeline recipe reveals.

  Variables. The script reads each one, falls back to the declared default on
  anything missing or unrecognised, and writes the result as a custom property
  the CSS below consumes.

    - size (18 to 64, default 27, in px): type size.
    - tone (dark-on-light | light-on-dark, default dark-on-light): the ink
      pair. Fresh-token grey is chosen to sit between the two.

  On every default the result matches the measured reference: 27px ink on a
  light chat ground.
-->

<div
  data-sc-ui-root
  class="sc-ui-streaming-text"
  aria-label="Streamed answer text"
  data-composition-variables='[
    { "id": "size", "type": "number", "role": "style", "label": "Size", "description": "Type size of the streamed words.", "default": 27, "min": 18, "max": 64, "step": 1, "unit": "px" },
    { "id": "tone", "type": "enum", "role": "style", "label": "Tone", "description": "Ink pair: dark words on a light ground, or light words on a dark ground.", "default": "dark-on-light", "options": [{ "value": "dark-on-light", "label": "Dark on light" }, { "value": "light-on-dark", "label": "Light on dark" }] }
  ]'
>
  <p class="sc-st-p">
    <span class="w">You</span> <span class="w">don&#39;t</span> <span class="w">need</span>
    <span class="w">a</span> <span class="w">video</span> <span class="w">editor.</span>
    <span class="w">SmashCut</span> <span class="w">renders</span> <span class="w">the</span>
    <span class="w">HTML</span> <span class="w">you</span> <span class="w">already</span>
    <span class="w">write</span> <span class="w">into</span> <span class="w">pixel-perfect,</span>
    <span class="w">deterministic</span> <span class="w">video.</span>
  </p>
</div>

<script>
  (function () {
    "use strict";

    var vars =
      window.__smashcut && window.__smashcut.getVariables
        ? window.__smashcut.getVariables()
        : {};

    // Unrecognised overrides return to their declared defaults.
    function pick(table, value, fallback) {
      return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
    }

    function clampNumber(value, min, max, fallback) {
      var n = typeof value === "number" ? value : parseFloat(value);
      if (!isFinite(n)) {
        return fallback;
      }
      return Math.min(max, Math.max(min, n));
    }

    var tones = {
      "dark-on-light": { ink: "#141414", fresh: "#767676" },
      "light-on-dark": { ink: "#f3f3f3", fresh: "#5f5f5f" },
    };

    var size = clampNumber(vars.size, 18, 64, 27);
    var tone = tones[pick(tones, vars.tone, "dark-on-light")];

    var roots = document.querySelectorAll(".sc-ui-streaming-text");
    for (var i = 0; i < roots.length; i += 1) {
      roots[i].style.setProperty("--sc-st-size", size + "px");
      roots[i].style.setProperty("--sc-st-ink", tone.ink);
      roots[i].style.setProperty("--sc-st-fresh", tone.fresh);
    }
  })();
</script>

<!--
  Timeline integration - GAPS is the measured token rhythm (seconds between
  consecutive words, zeros are words that arrive together). Cycle it for any
  word count; the ramp inks each word from fresh grey to full colour.

  var GAPS = [
    0.167, 0.100, 0.000, 0.367, 0.000, 0.167, 0.133, 0.100, 0.100, 0.133,
    0.167, 0.133, 0.000, 0.233, 0.167, 0.100, 0.000, 0.133, 0.133, 0.100,
    0.167, 0.133, 0.100, 0.133, 0.167, 0.100, 0.133, 0.100, 0.133,
  ];
  var t = startTime;
  gsap.utils.toArray('.sc-ui-streaming-text .w').forEach(function (w, i) {
    if (i > 0) t += GAPS[i % GAPS.length];
    tl.set(w, { opacity: 1 }, t);
    tl.fromTo(w, { color: '#767676' }, { color: 'var(--sc-st-ink)', duration: 0.2667, ease: 'none' }, t);
  });
-->
