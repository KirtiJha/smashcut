<!--
  X Follow Card - catalog component for SmashCut.

  Paste the markup and CSS into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.
-->

<div class="sc-catalog-x-follow-card">
  <header>
    <div class="avatar"></div>
    <div>
      <h3>X Follow Card</h3>
      <p>A social follow card with avatar, handle, and follower motion.</p>
    </div>
  </header>
  <div class="stat">30.6K</div>
  <div class="avatars">
    <span style="--c: var(--sc-l1)"></span><span style="--c: var(--sc-l2)"></span
    ><span style="--c: var(--sc-l2)"></span><span style="--c: var(--sc-l2)"></span
    ><span style="--c: var(--sc-l2)"></span><span style="--c: var(--sc-l2)"></span>
  </div>
</div>

<style>
  .sc-catalog-x-follow-card {
    --sc-accent: var(--accent, #f8fafc);
    --sc-ink: #111827;
    --sc-l1: rgba(255, 255, 255, 0.72);
    --sc-l2: rgba(255, 255, 255, 0.45);
    --sc-muted: #6b7280;
    --sc-surface: #ffffff;
    color: var(--sc-ink);
    font-family: Inter, system-ui, sans-serif;
  }
  .sc-catalog-x-follow-card {
    width: 700px;
    border-radius: 30px;
    padding: 34px;
    background: #0f172a;
    color: #fff;
    box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
  }
  .sc-catalog-x-follow-card header {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .sc-catalog-x-follow-card .avatar {
    width: 70px;
    height: 70px;
    border-radius: 22px;
    background: var(--sc-l1);
  }
  .sc-catalog-x-follow-card h3 {
    margin: 0;
    font-size: 36px;
    letter-spacing: -0.04em;
  }
  .sc-catalog-x-follow-card p {
    color: #94a3b8;
    margin: 4px 0 0;
  }
  .sc-catalog-x-follow-card .stat {
    margin-top: 30px;
    font-size: 82px;
    font-weight: 900;
    letter-spacing: -0.08em;
    transform: translateY(var(--sc-stat-y, 0px));
  }
  .sc-catalog-x-follow-card .avatars {
    display: flex;
    margin-top: 18px;
  }
  .sc-catalog-x-follow-card .avatars span {
    width: 46px;
    height: 46px;
    border-radius: 999px;
    border: 3px solid #0f172a;
    margin-left: -10px;
    background: var(--c);
    opacity: var(--sc-avatar-opacity, 1);
    transform: translateY(var(--sc-avatar-y, 0px));
  }
</style>

<!--
  Timeline integration:
  tl.fromTo('.sc-catalog-x-follow-card .stat', { '--sc-stat-y': '28px', opacity: 0 }, { '--sc-stat-y': '0px', opacity: 1, duration: 0.46, ease: 'back.out(1.6)' }, startTime); tl.fromTo('.sc-catalog-x-follow-card .avatars span', { '--sc-avatar-y': '18px', '--sc-avatar-opacity': 0 }, { '--sc-avatar-y': '0px', '--sc-avatar-opacity': 1, duration: 0.28, stagger: 0.05, ease: 'power2.out' }, startTime + 0.22);
-->
