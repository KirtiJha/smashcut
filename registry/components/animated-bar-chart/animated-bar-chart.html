<!--
  Animated Bar Chart - catalog component for SmashCut.

  Paste the markup and CSS into a composition. Drive the timeline integration
  from a paused GSAP timeline so renders remain deterministic.
-->

<div class="sc-catalog-animated-bar-chart">
  <header>
    <div>
      <h3>Animated Bar Chart</h3>
      <p>A compact data card with deterministic bar growth and value callouts.</p>
    </div>
    <strong>+42%</strong>
  </header>
  <div class="bars">
    <span class="bar" style="--h: 42%"></span><span class="bar" style="--h: 72%"></span
    ><span class="bar" style="--h: 56%"></span><span class="bar" style="--h: 88%"></span
    ><span class="bar" style="--h: 64%"></span><span class="bar" style="--h: 95%"></span
    ><span class="bar" style="--h: 78%"></span>
  </div>
  <svg viewBox="0 0 700 210">
    <path
      d="M20 172 C120 90, 190 118, 260 74 S430 112, 508 42 S620 82, 680 30"
      fill="none"
      stroke="currentColor"
      stroke-width="10"
      stroke-linecap="round"
    />
  </svg>
</div>

<style>
  .sc-catalog-animated-bar-chart {
    --sc-accent: var(--accent, #111827);
    --sc-ink: #111827;
    --sc-l1: rgba(17, 24, 39, 0.72);
    --sc-l2: rgba(17, 24, 39, 0.45);
    --sc-l3: rgba(17, 24, 39, 0.18);
    --sc-l4: rgba(17, 24, 39, 0.08);
    --sc-hair: rgba(17, 24, 39, 0.14);
    --sc-muted: #6b7280;
    --sc-surface: #ffffff;
    color: var(--sc-ink);
    font-family: Inter, system-ui, sans-serif;
  }
  .sc-catalog-animated-bar-chart {
    width: 760px;
    min-height: 420px;
    border-radius: 28px;
    background: #fff;
    padding: 34px;
    box-shadow: 0 28px 80px rgba(15, 23, 42, 0.16);
    display: grid;
    gap: 22px;
  }
  .sc-catalog-animated-bar-chart header {
    display: flex;
    justify-content: space-between;
    align-items: end;
  }
  .sc-catalog-animated-bar-chart h3 {
    margin: 0;
    font-size: 34px;
    letter-spacing: -0.04em;
  }
  .sc-catalog-animated-bar-chart strong {
    font-size: 54px;
    letter-spacing: -0.06em;
  }
  .sc-catalog-animated-bar-chart .bars {
    height: 210px;
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    align-items: end;
    gap: 14px;
  }
  .sc-catalog-animated-bar-chart .bar {
    height: calc(var(--h) * var(--sc-grow, 1));
    border-radius: 14px 14px 5px 5px;
    background: var(--sc-l1);
  }
  .sc-catalog-animated-bar-chart svg {
    width: 100%;
    height: 210px;
    overflow: visible;
  }
  .sc-catalog-animated-bar-chart path {
    color: var(--sc-l2);
    stroke-dasharray: 900;
    stroke-dashoffset: var(--sc-dash, 0);
  }
</style>

<!--
  Timeline integration:
  tl.fromTo('.sc-catalog-animated-bar-chart', { '--sc-grow': 0, '--sc-dash': 900 }, { '--sc-grow': 1, '--sc-dash': 0, duration: 1.2, ease: 'power3.out' }, startTime);
-->
