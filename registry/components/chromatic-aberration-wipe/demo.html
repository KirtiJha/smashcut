<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Chromatic Aberration Wipe - Demo</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
      }
      #demo {
        width: 1920px;
        height: 1080px;
        display: grid;
        place-items: center;
        background: #f7f7f8;
        font-family: Inter, system-ui, sans-serif;
      }
      .demo-frame {
        display: grid;
        place-items: center;
        padding: 52px;
        /* ponytail: scale wrapper (not a GSAP target) to fill ~65% of 1920x1080 */
        transform: scale(1.85);
      }
      .sc-catalog-chromatic-aberration-wipe {
        --sc-accent: #2563eb;
        --sc-ink: #111827;
        --sc-muted: #6b7280;
        --sc-surface: #ffffff;
        color: var(--sc-ink);
        font-family: Inter, system-ui, sans-serif;
      }
      .sc-catalog-chromatic-aberration-wipe {
        position: relative;
        width: 760px;
        height: 428px;
        overflow: hidden;
        border-radius: 30px;
        background: #111827;
        box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
      }
      .sc-catalog-chromatic-aberration-wipe .scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 58px;
        letter-spacing: -0.05em;
        color: #fff;
      }
      .sc-catalog-chromatic-aberration-wipe .from {
        background: linear-gradient(135deg, #111827, #374151);
        transform: translate(var(--sc-from-x, 0px), var(--sc-from-y, 0px))
          scale(var(--sc-from-scale, 1));
        filter: blur(var(--sc-from-blur, 0px));
      }
      .sc-catalog-chromatic-aberration-wipe .to {
        background: linear-gradient(135deg, #2563eb, #7c3aed);
        transform: translate(var(--sc-to-x, 0px), var(--sc-to-y, 0px)) scale(var(--sc-to-scale, 1));
        clip-path: inset(
          var(--sc-clip-top, 0%) var(--sc-clip-right, 100%) var(--sc-clip-bottom, 0%)
            var(--sc-clip-left, 0%)
        );
      }
      .sc-catalog-chromatic-aberration-wipe .fx {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        mix-blend-mode: screen;
        transform: translateX(var(--sc-fx-x, -110%));
      }
      .sc-catalog-chromatic-aberration-wipe .rgb {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: var(--sc-rgb-opacity, 0);
        background: linear-gradient(
          90deg,
          rgba(239, 68, 68, 0.35),
          transparent,
          rgba(34, 211, 238, 0.35)
        );
        transform: translateX(var(--sc-rgb-x, 0px));
      }
    </style>
  </head>
  <body>
    <div
      id="demo"
      data-composition-id="chromatic-aberration-wipe-demo"
      data-start="0"
      data-width="1920"
      data-height="1080"
      data-duration="5"
    >
      <div class="demo-frame">
        <div
          class="sc-catalog-chromatic-aberration-wipe"
          data-composition-variables='[
    { "id": "direction", "type": "enum", "role": "motion", "label": "Direction", "description": "The direction the reveal travels; both scenes slide the same way and the wipe edge follows.", "default": "left", "options": [{ "value": "left", "label": "Left" }, { "value": "right", "label": "Right" }, { "value": "up", "label": "Up" }, { "value": "down", "label": "Down" }] },
    { "id": "accent", "type": "enum", "role": "style", "label": "Accent", "description": "Colour family of the incoming scene&#39;s gradient.", "default": "blue", "options": [{ "value": "blue", "label": "Blue" }, { "value": "green", "label": "Green" }, { "value": "violet", "label": "Violet" }] },
    { "id": "aberration", "type": "number", "role": "style", "label": "Aberration", "description": "Multiplies the red/cyan channel split: 0 removes it, 1 is the stock strength, 2 doubles the offset and saturates the flash.", "default": 1, "min": 0, "max": 2, "step": 0.1, "unit": "x" }
  ]'
        >
          <div class="scene from">Before</div>
          <div class="scene to">Chromatic Aberration Wipe</div>
          <div class="fx"></div>
          <div class="rgb"></div>
        </div>
      </div>
      <script>
        (function () {
          "use strict";

          var vars =
            window.__smashcut && window.__smashcut.getVariables
              ? window.__smashcut.getVariables()
              : {};

          // Unrecognised overrides return to their declared defaults.
          var directions = {
            left: { ax: "1", ay: "0", t: "0", r: "1", b: "0", l: "0" },
            right: { ax: "-1", ay: "0", t: "0", r: "0", b: "0", l: "1" },
            up: { ax: "0", ay: "1", t: "1", r: "0", b: "0", l: "0" },
            down: { ax: "0", ay: "-1", t: "0", r: "0", b: "1", l: "0" },
          };
          var accents = {
            blue: ["#2563eb", "#7c3aed"],
            green: ["#047857", "#34d399"],
            violet: ["#6d28d9", "#a78bfa"],
          };

          function pick(table, value, fallback) {
            return Object.prototype.hasOwnProperty.call(table, value) ? value : fallback;
          }

          var direction = directions[pick(directions, vars.direction, "left")];
          var accent = accents[pick(accents, vars.accent, "blue")];

          var raw =
            typeof vars.aberration === "string" ? parseFloat(vars.aberration) : vars.aberration;
          var aberration =
            typeof raw === "number" && isFinite(raw) ? Math.min(2, Math.max(0, raw)) : 1;

          var roots = document.querySelectorAll(".sc-catalog-chromatic-aberration-wipe");
          for (var i = 0; i < roots.length; i += 1) {
            roots[i].style.setProperty("--sc-wipe-ax", direction.ax);
            roots[i].style.setProperty("--sc-wipe-ay", direction.ay);
            roots[i].style.setProperty("--sc-wipe-t", direction.t);
            roots[i].style.setProperty("--sc-wipe-r", direction.r);
            roots[i].style.setProperty("--sc-wipe-b", direction.b);
            roots[i].style.setProperty("--sc-wipe-l", direction.l);
            roots[i].style.setProperty("--sc-scene-a", accent[0]);
            roots[i].style.setProperty("--sc-scene-b", accent[1]);
            roots[i].style.setProperty("--sc-rgb-strength", String(aberration));
          }
        })();
      </script>
      <script>
        const tl = gsap.timeline({ paused: true });
        const startTime = 0.5;
        tl.fromTo(
          ".sc-catalog-chromatic-aberration-wipe .to",
          { "--sc-clip-right": "100%", "--sc-to-x": "60px", "--sc-to-scale": 1.04 },
          {
            "--sc-clip-right": "0%",
            "--sc-to-x": "0px",
            "--sc-to-scale": 1,
            duration: 0.9,
            ease: "power3.inOut",
          },
          startTime,
        );
        tl.to(
          ".sc-catalog-chromatic-aberration-wipe .from",
          {
            "--sc-from-x": "-70px",
            "--sc-from-scale": 0.96,
            "--sc-from-blur": "5px",
            duration: 0.9,
            ease: "power3.inOut",
          },
          startTime,
        );
        tl.fromTo(
          ".sc-catalog-chromatic-aberration-wipe .fx",
          { "--sc-fx-x": "-110%" },
          { "--sc-fx-x": "110%", duration: 0.58, ease: "power2.inOut" },
          startTime + 0.18,
        );
        tl.fromTo(
          ".sc-catalog-chromatic-aberration-wipe .rgb",
          { "--sc-rgb-opacity": 0, "--sc-rgb-x": "-16px" },
          {
            "--sc-rgb-opacity": 1,
            "--sc-rgb-x": "16px",
            repeat: 3,
            yoyo: true,
            duration: 0.07,
            ease: "steps(1)",
          },
          startTime + 0.32,
        );
        tl.set({}, {}, 5);
        window.__timelines = window.__timelines || {};
        window.__timelines["chromatic-aberration-wipe-demo"] = tl;
      </script>
    </div>
    <style>
      .sc-catalog-chromatic-aberration-wipe {
        --sc-accent: #2563eb;
        --sc-ink: #111827;
        --sc-muted: #6b7280;
        --sc-surface: #ffffff;
        color: var(--sc-ink);
        font-family: Inter, system-ui, sans-serif;
      }
      .sc-catalog-chromatic-aberration-wipe {
        position: relative;
        width: 760px;
        height: 428px;
        overflow: hidden;
        border-radius: 30px;
        background: #111827;
        box-shadow: 0 28px 80px rgba(15, 23, 42, 0.2);
      }
      .sc-catalog-chromatic-aberration-wipe .scene {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-weight: 900;
        font-size: 58px;
        letter-spacing: -0.05em;
        color: #fff;
      }
      .sc-catalog-chromatic-aberration-wipe .from {
        background: linear-gradient(135deg, #111827, #374151);
        transform: translate(
            calc(var(--sc-from-x, 0px) * var(--sc-wipe-ax, 1)),
            calc(var(--sc-from-y, 0px) + var(--sc-from-x, 0px) * var(--sc-wipe-ay, 0))
          )
          scale(var(--sc-from-scale, 1));
        filter: blur(var(--sc-from-blur, 0px));
      }
      .sc-catalog-chromatic-aberration-wipe .to {
        background: linear-gradient(135deg, var(--sc-scene-a, #2563eb), var(--sc-scene-b, #7c3aed));
        transform: translate(
            calc(var(--sc-to-x, 0px) * var(--sc-wipe-ax, 1)),
            calc(var(--sc-to-y, 0px) + var(--sc-to-x, 0px) * var(--sc-wipe-ay, 0))
          )
          scale(var(--sc-to-scale, 1));
        clip-path: inset(
          calc(var(--sc-clip-top, 0%) + var(--sc-clip-right, 100%) * var(--sc-wipe-t, 0))
            calc(var(--sc-clip-right, 100%) * var(--sc-wipe-r, 1))
            calc(var(--sc-clip-bottom, 0%) + var(--sc-clip-right, 100%) * var(--sc-wipe-b, 0))
            calc(var(--sc-clip-left, 0%) + var(--sc-clip-right, 100%) * var(--sc-wipe-l, 0))
        );
      }
      .sc-catalog-chromatic-aberration-wipe .fx {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.75), transparent);
        mix-blend-mode: screen;
        transform: translateX(var(--sc-fx-x, -110%));
      }
      .sc-catalog-chromatic-aberration-wipe .rgb {
        position: absolute;
        inset: 0;
        pointer-events: none;
        opacity: calc(var(--sc-rgb-opacity, 0) * var(--sc-rgb-strength, 1));
        background: linear-gradient(
          90deg,
          rgba(239, 68, 68, 0.35),
          transparent,
          rgba(34, 211, 238, 0.35)
        );
        transform: translateX(calc(var(--sc-rgb-x, 0px) * var(--sc-rgb-strength, 1)));
      }
    </style>
  </body>
</html>
